name: Export text (Markdown, HTML, PDF)

# Regenerates export/ whenever the text changes, commits it back, and uploads the PDF
# to the "latest-text" release (kept out of git history so it doesn't bloat the repo).
on:
  push:
    branches: [main]
    paths:
      - translation.json
      - Pardes_Rimmonim.json
      - tools/export_text.py
      - .github/workflows/export-text.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-text
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts and Python packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-core fonts-freefont-ttf
          pip install -q weasyprint markdown

      - name: Build export
        run: python3 tools/export_text.py --pdf

      - name: Commit Markdown and HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A export
          if git diff --cached --quiet; then
            echo "export/ unchanged"
          else
            git commit -m "Regenerate text export"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi

      - name: Upload PDF to the latest-text release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-text >/dev/null 2>&1 || \
            gh release create latest-text --title "Latest text export" \
              --notes "Pardes Rimmonim translation as one PDF, regenerated automatically whenever the text changes."
          gh release upload latest-text export/Pardes_Rimmonim.pdf --clobber
